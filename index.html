<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chuột</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #rat {
      width: 380px;
      height: auto;
      opacity: 0;
      transform: scale(0.02);
      animation: runForward 2.8s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
    }

    @keyframes runForward {
      0% {
        opacity: 0;
        transform: scale(0.02) translateY(-120px) rotate(0deg);
      }
      15% {
        opacity: 1;
        transform: scale(0.15) translateY(-90px) rotate(-6deg);
      }
      35% {
        transform: scale(0.35) translateY(-60px) rotate(6deg);
      }
      55% {
        transform: scale(0.6) translateY(-35px) rotate(-5deg);
      }
      75% {
        transform: scale(0.82) translateY(-15px) rotate(4deg);
      }
      90% {
        transform: scale(0.95) translateY(-5px) rotate(-2deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0) rotate(0deg);
      }
    }
  </style>
</head>
<body>

  <img id="rat" src="chuot.jpg" alt="chuot">

  <script>
    const rat = document.getElementById('rat');

    rat.addEventListener('animationend', () => {
      rat.src = 'chuot2.jpg';

      setTimeout(() =>{
        rat.src='chuot3.png';
      },750);
    });
  </script>

</body>
</html>
